# Single-host development/demo stack.
# No `version:` key — it is obsolete in the current Compose Specification.
# Requires Docker Compose v2.20+ (for depends_on conditions used below).

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eklavya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklavya}
      POSTGRES_DB: ${POSTGRES_DB:-eklavya}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 moved PGDATA under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent, not .../data.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # One-shot: schema must exist before api/worker start.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Keep one worker while using the process-local RPM cap. Horizontal scaling
    # requires LLM_REQUESTS_PER_MINUTE=0 or a distributed/project-wide limiter.

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
