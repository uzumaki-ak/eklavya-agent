name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: eklavya
          POSTGRES_PASSWORD: eklavya
          POSTGRES_DB: eklavya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eklavya -d eklavya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://eklavya:eklavya@localhost:5432/eklavya

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests alembic

      - name: Compile
        run: python -m compileall -q app tests alembic

      - name: Test
        run: python -m pytest -q

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check migration-model drift
        run: alembic check

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
