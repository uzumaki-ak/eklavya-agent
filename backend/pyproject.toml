[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eklavya-agent"
version = "0.1.0"
description = "Generator + Reviewer agent pipeline for grade-appropriate educational content"
requires-python = ">=3.11"

dependencies = [
    # Pins verified current as of 2026-08-27 (see ARCHITECTURE.md "Verified stable pins")
    "anthropic==1.1.0",
    "google-genai==2.19.0",  # latest stable verified 2026-08-27
    "langgraph==1.2.11",
    "saq[redis]==0.26.4",
    "tenacity==9.1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
